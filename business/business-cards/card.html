<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>WCphotography Business Card</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* 3.5 x 2 in card + 0.125 in bleed on every side = 3.75 x 2.25 in */
  @page { size: 3.75in 2.25in; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg: #0E0F11; --text: #F2F0EB; --muted: #A3A29D; --accent: #E0A458; }
  html, body { background: var(--bg); color: var(--text); font-family: "Inter", sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .card { width: 3.75in; height: 2.25in; position: relative; overflow: hidden; page-break-after: always; background: var(--bg); }
  /* keep everything important 0.25 in from the trimmed edge */
  .safe { position: absolute; inset: 0.25in; }

  .front .safe { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .front .logo { width: 2.35in; }
  .front .services { margin-top: 0.14in; font-size: 6pt; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); }
  .front .glow { position: absolute; right: -0.6in; top: -0.6in; width: 1.8in; height: 1.8in; border-radius: 50%; border: 1.2pt solid var(--accent); opacity: .18; }

  .back .mark { position: absolute; right: 0.25in; top: 0.25in; width: 0.42in; }
  .back .name { font-family: "Playfair Display", serif; font-weight: 700; font-size: 15pt; line-height: 1.1; }
  .back .role { margin-top: 3pt; font-size: 5.6pt; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
  .back .rule { width: 0.45in; height: 1pt; background: var(--accent); margin: 0.11in 0 0.1in; }
  .back ul { list-style: none; font-size: 7pt; line-height: 1.6; }
  .back li span { display: inline-block; width: 0.48in; font-size: 5pt; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .back .city { position: absolute; right: 0; bottom: 0; font-size: 5pt; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .back .bar { position: absolute; left: 0; bottom: 0; width: 100%; height: 0.2in; background: var(--accent); } /* 0.075in visible after trim */
</style>
</head>
<body>
  <div class="card front">
    <div class="glow"></div>
    <div class="safe">
      <img class="logo" src="../../assets/images/logo/logo.svg" alt="WCphotography">
      <div class="services">Photography · FPV Aerials · Websites</div>
    </div>
  </div>

  <div class="card back">
    <div class="bar"></div>
    <img class="mark" src="../../assets/images/logo/logo-mark.svg" alt="">
    <div class="safe">
      <div class="name" id="name"></div>
      <div class="role" id="role"></div>
      <div class="rule"></div>
      <ul>
        <li><span>Phone</span><b id="phone" style="font-weight:500"></b></li>
        <li><span>Email</span>wcvisuals1@gmail.com</li>
        <li><span>Web</span>wcphotography.org</li>
        <li><span>Social</span>@wcphotography11</li>
      </ul>
      <div class="city">Huntsville, AL</div>
    </div>
  </div>

<script>
  const people = {
    silas: { name: "Silas Whitt", role: "Co-Founder · Head Aerial Videographer", phone: "(256) 497-8305" },
    chase: { name: "Chase Callanan", role: "Co-Founder · Head Photographer", phone: "(205) 723-8037" },
  };
  const p = people[new URLSearchParams(location.search).get("person")] || people.silas;
  for (const k of ["name", "role", "phone"]) document.getElementById(k).textContent = p[k];
</script>
</body>
</html>
